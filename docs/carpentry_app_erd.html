<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  BUSINESSES ||--o{ USERS : employs
  BUSINESSES ||--o{ CLIENTS : owns
  BUSINESSES ||--o{ SUBCONTRACTORS : hires
  BUSINESSES ||--o{ MATERIALS : caches
  CLIENTS ||--o{ PROJECTS : has
  PROJECTS ||--o{ BIDS : has
  BIDS ||--o{ BID_LINE_ITEMS : contains
  MATERIALS ||--o{ BID_LINE_ITEMS : referenced_by
  PROJECTS ||--o{ PROJECT_SUBCONTRACTORS : assigns
  SUBCONTRACTORS ||--o{ PROJECT_SUBCONTRACTORS : works_on
  PROJECTS ||--o{ ATTACHMENTS : has
  BUSINESSES {
    uuid id PK
    string name
  }
  USERS {
    uuid id PK
    uuid business_id FK "nullable, null when user_type is global"
    string user_type "business or global"
    string role
    string name
    string email
    string preferred_language
  }
  CLIENTS {
    uuid id PK
    uuid business_id FK
    string name
    string phone_encrypted
    string email_encrypted
    string address_encrypted
    string notes
    string preferred_language
  }
  PROJECTS {
    uuid id PK
    uuid client_id FK
    uuid business_id FK
    string title
    string status
    date start_date
    date end_date
    string description
  }
  MATERIALS {
    uuid id PK
    uuid business_id FK
    string name
    string source
    string unit
    decimal cached_price
    timestamp price_updated_at
  }
  BIDS {
    uuid id PK
    uuid project_id FK
    string status
    decimal total_amount
    timestamp sent_at
  }
  BID_LINE_ITEMS {
    uuid id PK
    uuid bid_id FK
    uuid material_id FK
    string description
    decimal quantity
    string unit
    decimal unit_price
    string category
  }
  SUBCONTRACTORS {
    uuid id PK
    uuid business_id FK
    string name
    string trade
    string phone_encrypted
    decimal rate
  }
  PROJECT_SUBCONTRACTORS {
    uuid id PK
    uuid project_id FK
    uuid subcontractor_id FK
    string role
    decimal agreed_rate
  }
  ATTACHMENTS {
    uuid id PK
    uuid project_id FK
    string type
    string storage_key
    string caption
    string scrub_status
    timestamp validated_at
    timestamp uploaded_at
  }`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
