services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carpentry
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: carpentry_dev
    ports:
      - "5432:5432"
    volumes:
      - carpentry_pg_data:/var/lib/postgresql/data

volumes:
  carpentry_pg_data:
